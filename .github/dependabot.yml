version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      include: 'scope'

updates:
  - package-ecosystem: 'cargo'
    directory: '/'
    allow:
      - dependency-type: 'all'
    patterns:
      - '*'
    cooldown:
      default-days: 5
    multi-ecosystem-group: 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    patterns:
      - '*'
    cooldown:
      default-days: 5
    multi-ecosystem-group: 'dependencies'
