name: Build

on: pull_request

env:
  RUSTFLAGS: '-Dwarnings'

permissions: read-all

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Preflight // Test
        run: |
          sudo apt-get install -y xvfb libnotify4 libsecret-1-0
          wget -q https://github.com/jgraph/drawio-desktop/releases/download/v32.6.1/drawio-amd64-32.6.1.deb
          sudo dpkg -i drawio-amd64-32.6.1.deb
          sudo apt-get -y -f install

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Build
        run: just build

      - name: Test
        run: xvfb-run --auto-servernum just test

      - name: Format
        run: just fmt-check

      - name: Clippy
        run: just clippy

      - name: Audit
        run: just audit
